[project]
name = "fastspeech2-english-telugu"
version = "1.0.0"
description = "FastSpeech 2 text-to-speech for English (Svarah) and Telugu (IndicTTS)"
requires-python = ">=3.11,<3.14"
# same versions as requirements.txt (the ones used on Kaggle, Python 3.13)
dependencies = [
    "torch==2.11.0",
    "numpy==2.1.3",
    "scipy==1.16.3",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "numba==0.61.2",
    "pyworld==0.3.5",
    "tgt==1.5",
    "g2p-en==2.1.0",
    "nltk==3.9.1",
    "inflect==7.5.0",
    "unidecode==1.4.0",
    "pypinyin==0.55.0",
    "matplotlib==3.10.0",
    "pyyaml==6.0.3",
    "tensorboard==2.20.0",
    "tqdm==4.67.3",
    "scikit-learn==1.6.1",
]

[tool.uv]
package = false
